name: iOS

on:
  push:
    branches: [main, "ci/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test KeyboardCore
        working-directory: ios/Packages/KeyboardCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Secrets.xcconfig
        working-directory: ios
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          url="${API_BASE_URL:-https://keyboardai.example.workers.dev}"
          # xcconfig treats // as a comment, so escape it as /$()/
          printf 'API_BASE_URL = %s\n' "${url/:\/\//:\/\$()\/}" > Config/Secrets.xcconfig
          cat Config/Secrets.xcconfig

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project KeyboardAI.xcodeproj \
            -scheme KeyboardAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; tail -n 40 build.log; exit 1; }
          grep -E "BUILD SUCCEEDED" build.log

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KeyboardAI.app Payload/
          ls Payload/KeyboardAI.app/PlugIns
          zip -qry KeyboardAI-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardAI-unsigned-ipa
          path: ios/KeyboardAI-unsigned.ipa
          retention-days: 30

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Missing secret ASC_KEY_P8"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Secrets.xcconfig
        working-directory: ios
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          url="${API_BASE_URL:-https://keyboardai.example.workers.dev}"
          printf 'API_BASE_URL = %s\n' "${url/:\/\//:\/\$()\/}" > Config/Secrets.xcconfig

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          # Unique, increasing build number per run and re-run
          build_number=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "Build number: $build_number"
          # Archive unsigned; exportArchive signs for distribution with cloud-managed signing
          xcodebuild archive \
            -project KeyboardAI.xcodeproj \
            -scheme KeyboardAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyboardAI.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$build_number" \
            CODE_SIGNING_ALLOWED=NO \
            > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -80; tail -n 40 archive.log; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" archive.log

      - name: Export and upload to TestFlight
        working-directory: ios
        run: |
          cp Config/ExportOptions.plist build/ExportOptions.plist
          plutil -replace teamID -string "$APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/KeyboardAI.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
